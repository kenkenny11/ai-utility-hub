name: Gemini Content Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AI content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          mkdir -p data

          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          prompt = ("Create a compact daily content pack for AI Utility Hub. "
                    "Return ONLY valid JSON with headline, intro, exactly 5 ideas, "
                    "and exactly 3 tips. No markdown. Keep claims general and useful.")

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "maxOutputTokens": 1200
              }
          }

          def generate(model, attempts=4):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              last_error = None

              for attempt in range(attempts):
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="replace")
                      last_error = f"Gemini API HTTP {e.code}: {body}"

                      if e.code not in (429, 500, 502, 503, 504) or attempt == attempts - 1:
                          raise RuntimeError(last_error)

                      delay = min(45, 5 * (2 ** attempt))
                      print(f"{model} returned HTTP {e.code}; retrying in {delay}s...")
                      time.sleep(delay)

              raise RuntimeError(last_error or "Gemini request failed")

          # Try several currently supported text models. A 503 is a temporary
          # serving-capacity problem, so don't depend on one model only.
          models = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite"
          ]

          result = None
          errors = []

          for model in models:
              try:
                  print(f"Trying {model}...")
                  result = generate(model)
                  print(f"Success with {model}.")
                  break
              except RuntimeError as error:
                  errors.append(str(error))
                  print(f"{model} unavailable: {error}")

          if result is None:
              print("All Gemini models were temporarily unavailable.")
              print("Using a local fallback content pack so the workflow remains healthy.")
              fallback = {
                  "headline": "Practical AI Ideas for Today",
                  "intro": "Simple ways to use AI tools more effectively without adding unnecessary complexity.",
                  "ideas": [
                      "Turn a long article into a short action checklist.",
                      "Create three alternative headlines for the same piece of content.",
                      "Ask AI to convert rough notes into a clear step-by-step plan.",
                      "Use AI to compare two products by features, limits, and use cases.",
                      "Create a reusable prompt template for a task you perform often."
                  ],
                  "tips": [
                      "Give AI the goal, audience, and desired format before asking for an answer.",
                      "Ask for concise output first, then expand only the sections you need.",
                      "Verify important facts before publishing or acting on AI-generated information."
                  ],
                  "source": "local-fallback"
              }
              parsed = fallback
          else:
              parsed = json.loads(result["candidates"][0]["content"]["parts"][0]["text"])
          parsed = json.loads(result["candidates"][0]["content"]["parts"][0]["text"])

          if not isinstance(parsed.get("ideas"), list) or len(parsed["ideas"]) != 5:
              raise ValueError("Gemini response must contain exactly 5 ideas")
          if not isinstance(parsed.get("tips"), list) or len(parsed["tips"]) != 3:
              raise ValueError("Gemini response must contain exactly 3 tips")

          parsed["updated"] = datetime.now(timezone.utc).isoformat()

          with open("data/daily.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Gemini content"
          git push
