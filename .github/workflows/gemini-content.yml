name: Gemini Content Refresh

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/daily.json"
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AI content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          prompt = """Create a compact daily content pack for AI Utility Hub.
Return ONLY valid JSON with these keys:
headline: short headline
intro: 1-2 sentence introduction
ideas: array of exactly 5 practical AI utility ideas
tips: array of exactly 3 short tips
Keep claims general and useful. No markdown."""
          payload = {
            "contents": [{"parts": [{"text": prompt}]}],
            "generationConfig": {
              "responseMimeType": "application/json",
              "maxOutputTokens": 1200
            }
          }
          req = urllib.request.Request(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
            data=json.dumps(payload).encode(),
            headers={
              "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              "Content-Type": "application/json"
            },
            method="POST"
          )
          with urllib.request.urlopen(req, timeout=60) as response:
            data = json.load(response)

          text = data["candidates"][0]["content"]["parts"][0]["text"]
          parsed = json.loads(text)

          if not isinstance(parsed.get("ideas"), list) or len(parsed["ideas"]) != 5:
              raise ValueError("Gemini response must contain exactly 5 ideas")
          if not isinstance(parsed.get("tips"), list) or len(parsed["tips"]) != 3:
              raise ValueError("Gemini response must contain exactly 3 tips")

          parsed["updated"] = datetime.now(timezone.utc).isoformat()

          with open("data/daily.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Gemini content"
          git push
