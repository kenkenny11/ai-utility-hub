name: Gemini Content Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AI content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          mkdir -p data

          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          prompt = ("Create a compact daily content pack for AI Utility Hub. "
                    "Return ONLY valid JSON with headline, intro, exactly 5 ideas, "
                    "and exactly 3 tips. No markdown. Keep claims general and useful.")

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "maxOutputTokens": 1200
              }
          }

          def generate(model, attempts=5):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              last_error = None

              for attempt in range(attempts):
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="replace")
                      last_error = f"Gemini API HTTP {e.code}: {body}"

                      if e.code not in (429, 500, 502, 503, 504) or attempt == attempts - 1:
                          raise RuntimeError(last_error)

                      delay = min(60, 5 * (2 ** attempt))
                      print(f"{model} returned HTTP {e.code}; retrying in {delay}s...")
                      time.sleep(delay)

              raise RuntimeError(last_error or "Gemini request failed")

          # Gemini 3.8 Flash is the primary model. If capacity is temporarily
          # unavailable after retries, use the lower-latency Flash-Lite model.
          try:
              result = generate("gemini-3.8-flash")
          except RuntimeError as primary_error:
              print("Primary model unavailable after retries.")
              print(primary_error)
              result = generate("gemini-3.5-flash-lite")

          parsed = json.loads(result["candidates"][0]["content"]["parts"][0]["text"])

          if not isinstance(parsed.get("ideas"), list) or len(parsed["ideas"]) != 5:
              raise ValueError("Gemini response must contain exactly 5 ideas")
          if not isinstance(parsed.get("tips"), list) or len(parsed["tips"]) != 3:
              raise ValueError("Gemini response must contain exactly 3 tips")

          parsed["updated"] = datetime.now(timezone.utc).isoformat()

          with open("data/daily.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Gemini content"
          git push
